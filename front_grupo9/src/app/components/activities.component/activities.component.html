<div class="container">
  <h2 class="section-title sports-border">Deportes</h2>
  <div class="grid">
    <mat-card *ngFor="let act of deportes" class="activity-card">
      <mat-card-header class="sports-bg">
        <mat-card-title>
          <div class="header-top">
            <h3>{{ act.nombre }}</h3>
            <span class="icon">🏆</span>
          </div>
        </mat-card-title>
        <mat-card-subtitle>Competición deportiva escolar</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <div class="stats">
          <span>👥 Participantes</span>
          <span><strong>{{ act.minimoJugadores }}</strong> / 14</span>
        </div>
        <div class="progress-bar">
          <div class="fill blue" [style.width.%]="(act.minimoJugadores / 14) * 100"></div>
        </div>
        <div class="material-btn">
          <span>📦 Ver Materiales (3)</span>
          <span class="arrow">→</span>
        </div>
      </mat-card-content>
      
      <mat-card-actions>
        <button mat-raised-button color="primary" class="btn-enroll">Inscribirse</button>
      </mat-card-actions>
    </mat-card>
  </div>

  <h2 class="section-title games-border">Videojuegos</h2>
  <div class="grid">
    <mat-card *ngFor="let game of videojuegos" class="activity-card">
      <mat-card-header class="games-bg">
        <mat-card-title>
          <div class="header-top">
            <h3>{{ game.nombre }}</h3>
            <span class="icon">🎮</span>
          </div>
        </mat-card-title>
        <mat-card-subtitle>{{ game.descripcion }}</mat-card-subtitle>
      </mat-card-header>
      
      <mat-card-content>
        <div class="stats">
          <span>👥 Participantes</span>
          <span><strong>{{ game.actual }}</strong> / {{ game.max }}</span>
        </div>
        <div class="progress-bar">
          <div class="fill yellow" [style.width.%]="(game.actual / game.max) * 100"></div>
        </div>
        <div class="material-btn">
          <span>📦 Ver Materiales ({{ game.materiales }})</span>
          <span class="arrow">→</span>
        </div>
      </mat-card-content>
      
      <mat-card-actions>
        <button mat-raised-button color="primary" class="btn-enroll">Inscribirse</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
