<div class="container-fluid">
    <div class="d-flex align-items-center p-4 mt-5 bg-light mx-3 rounded rounded-5 shadow">
        <div style="width: 6px; height: 43px; background-color: rgb(145, 236, 9);" class="rounded rounded-pill me-3"></div>
        <h1 class="mb-0">Eventos disponibles</h1>
    </div>
    
    <div *ngIf="eventos" class="row mt-4 mx-3">
        <div *ngFor="let evento of eventosDisponibles" class="col-12 col-md-6 mb-4">
            <div class="card shadow rounded-4 border-0 overflow-hidden mt-5" style="position: relative; height: 20rem;">
                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                            background: linear-gradient(135deg, rgba(9, 164, 236, 0.85) 0%, rgba(41, 128, 185, 0.75) 100%), 
                            url('campo_tajamar.jpg') center/cover; 
                            z-index: 1;">
                </div>
                <div class="card-body p-4 d-flex flex-column justify-content-between" style="position: relative; z-index: 2;">
                    <div>
                        <div class="d-flex align-items-center mb-3">
                            <div style="width: 5px; height: 45px; background-color: rgb(255, 255, 255);" class="rounded rounded-pill me-3"></div>
                            <h4 class="card-title mb-0 fw-bold text-white">Evento #{{evento.idEvento}}</h4>
                        </div>
                        <div class="d-flex align-items-center mb-2">
                            <span class="me-2 text-white fs-5"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff"><path d="M200-640h560v-80H200v80Zm0 0v-80 80Zm0 560q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v227q-19-9-39-15t-41-9v-43H200v400h252q7 22 16.5 42T491-80H200Zm520 40q-83 0-141.5-58.5T520-240q0-83 58.5-141.5T720-440q83 0 141.5 58.5T920-240q0 83-58.5 141.5T720-40Zm67-105 28-28-75-75v-112h-40v128l87 87Z"/></svg></span>
                            <p class="mb-0 text-white fw-semibold fs-5">{{evento.fechaEvento | date:'longDate'}}</p>
                        </div>
                    </div>
                    <div class="mt-3">
                        <button class="btn btn-light w-100 rounded-pill fw-bold shadow-sm" [routerLink]="['/activities', evento.idEvento]">Ir a evento</button>
                    </div>
                </div>
            </div>  
        </div>


        <!-- EVENTOS NO DISPONIBLES (TRANSCURRIDOS EL MISMO AÑO) -->

        <div class="d-flex align-items-center p-4 mt-5 bg-light rounded rounded-5 shadow">
            <div style="width: 6px; height: 43px; background-color: rgb(236, 17, 9);" class="rounded rounded-pill me-3"></div>
            <h1 class="mb-0">Eventos anteriores</h1>
        </div>

        <div *ngFor="let evento of eventosTranscurridosMismoYear" class="col-12 col-md-6 mb-4">
            <div class="card shadow rounded-4 border-0 overflow-hidden mt-5" style="position: relative; height: 20rem;">
                <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
                            background: linear-gradient(135deg, rgba(247, 51, 40, 0.85) 0%, rgba(41, 128, 185, 0.75) 100%), 
                            url('campo_tajamar.jpg') center/cover; 
                            z-index: 1;">
                </div>
                <div class="card-body p-4 d-flex flex-column justify-content-between" style="position: relative; z-index: 2;">
                    <div>
                        <div class="d-flex align-items-center mb-3">
                            <div style="width: 5px; height: 45px; background-color: rgb(255, 255, 255);" class="rounded rounded-pill me-3"></div>
                            <h4 class="card-title mb-0 fw-bold text-white">Evento #{{evento.idEvento}}</h4>
                        </div>
                        <div class="d-flex align-items-center mb-2">
                            <span class="me-2 text-white fs-5"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#ffffff"><path d="M200-80q-33 0-56.5-23.5T120-160v-560q0-33 23.5-56.5T200-800h40v-80h80v80h320v-80h80v80h40q33 0 56.5 23.5T840-720v255l-80 80v-175H200v400h248l80 80H200Zm0-560h560v-80H200v80Zm0 0v-80 80ZM662-60 520-202l56-56 85 85 170-170 56 57L662-60Z"/></svg></span>
                            <p class="mb-0 text-white fw-semibold fs-5">{{evento.fechaEvento | date:'longDate'}}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>
